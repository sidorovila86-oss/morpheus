<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morpheus at the Desk — Night 1</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=DotGothic16&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'PixFix';src:url(fonts/pixfix-400.ttf?v=7);font-weight:400;unicode-range:U+32,U+35,U+37,U+414,U+41A,U+41E-41F,U+428-429,U+432,U+434,U+435,U+448-449,U+44A-44E,U+451,U+401,U+415}
@font-face{font-family:'PixFix';src:url(fonts/pixfix-600.ttf?v=7);font-weight:600 900;unicode-range:U+32,U+35,U+37,U+414,U+41A,U+41E-41F,U+428-429,U+432,U+434,U+435,U+448-449,U+44A-44E,U+451,U+401,U+415}
:root{--font:'PixFix','Pixelify Sans',monospace;--ink:#26222b;--paper:#d8e2d6;--paper2:#c7dcd0;--line:#b2ba90;--dream:#c7b3e6;--red:#a04a3e;--green:#4f8a5e}
html,body{margin:0;height:100%;background:#141016;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:480px;height:270px;transform-origin:0 0;overflow:hidden;overflow:clip;
  font-family:var(--font);font-variant-ligatures:none;color:var(--ink);user-select:none;-webkit-user-select:none}
img{image-rendering:pixelated;display:block;-webkit-user-drag:none;pointer-events:none}
canvas{image-rendering:pixelated;display:block}
.abs{position:absolute;left:0;top:0}
#room{position:absolute;left:0;top:0}

/* hallway behind the glass */
#hall{position:absolute;left:118px;top:12px;width:348px;height:93px}
#vclip{position:absolute;left:0;top:0;width:348px;height:93px;overflow:hidden}   /* the arched glass only: guests never walk over the frame */
#wfx{position:absolute;left:112px;top:6px;z-index:805;pointer-events:none;mix-blend-mode:screen}
#visitor.appear{animation:vAppear .7s steps(7) forwards}
@keyframes vAppear{0%{opacity:0;transform:scale(1.5,.1);filter:brightness(3) saturate(0)}35%{opacity:.7;transform:scale(.8,1.2);filter:brightness(2.2) saturate(.4)}65%{opacity:1;transform:scale(1.06,.95);filter:brightness(1.4)}100%{opacity:1;transform:none;filter:none}}
#visitor.vanish{animation:vVanish .6s steps(6) forwards}
@keyframes vVanish{0%{opacity:1;transform:none;filter:none}40%{opacity:.85;transform:scale(.9,1.1);filter:brightness(2)}100%{opacity:0;transform:scale(.25,1.5) translateY(-8px);filter:brightness(3.5) saturate(0)}}
#visitor.float img{animation:vFloat 1.3s steps(2) infinite alternate}
@keyframes vFloat{to{transform:translateY(-1px)}}
#visitor{position:absolute;left:-70px;top:17px;width:64px;height:76px;transform-origin:50% 100%;
  transition:left .7s cubic-bezier(.3,.7,.3,1),opacity .5s,transform .9s;cursor:help}
#visitor img{pointer-events:auto}
#visitor.walk{animation:bob .32s infinite alternate steps(2,jump-none)}
@keyframes bob{from{margin-top:0}to{margin-top:-2px}}
#bubble{position:absolute;z-index:850;left:158px;top:4px;width:186px;box-sizing:border-box;background:var(--paper);border:1px solid var(--ink);
  box-shadow:1px 1px 0 var(--ink);padding:3px 5px 4px;font-size:var(--fs7);line-height:8px;opacity:0;transition:opacity .15s;min-height:18px}
#bubble:before{content:"";position:absolute;left:-5px;top:9px;border:4px solid transparent;border-right-color:var(--ink);border-left:0}
#bubble .who{font-weight:600;font-size:var(--fs7);color:#6e5568;display:block;margin-bottom:1px}
.btn{position:absolute;font:600 var(--fs8) var(--font);color:var(--ink);background:#c9b46a;border:1px solid var(--ink);
  box-shadow:0 2px 0 var(--ink);padding:1px 6px 2px;cursor:pointer}
.btn:hover{background:#e3c25a;transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
#ask{left:172px;top:78px;display:none;z-index:850}
#check{left:226px;top:78px;display:none;z-index:850;background:#a8c0d8}#check:hover{background:#c4d8ec}#check.off{opacity:.55}
#quiz{position:absolute;left:276px;top:104px;width:186px;z-index:851;display:none}
.qz{display:block;background:var(--paper);border:1px solid var(--ink);box-shadow:1px 1px 0 var(--ink);margin-bottom:2px;padding:1px 4px 2px;font-size:var(--fs7);line-height:8px;cursor:pointer}
.qz:hover{background:#efe2b0}.qz.done{color:#6e5568}.qz.done:before{content:'✓ '}

/* desk items */
.item{position:absolute;left:0;top:0;cursor:grab;z-index:20}
.item .shd{position:absolute;left:0;top:0;pointer-events:none;z-index:-1}
.item .spr{position:absolute;pointer-events:none}
.item img{position:relative}
.gl{position:absolute;left:13px;width:62px;height:7px;font-size:var(--fs6);line-height:7px;color:#cfc6d8;pointer-events:none}
.gl span{position:absolute;left:0;top:0}.gl b{position:absolute;right:0;top:0;font-weight:400;color:#f4f0e6}
#g2wrap{position:absolute}
.lit{position:absolute;left:0;top:0;pointer-events:none;z-index:800}
#glow{mix-blend-mode:soft-light}
#slotglow{mix-blend-mode:screen;z-index:801;transition:opacity .25s steps(3)}
.item.dragging{cursor:grabbing}
#film{position:absolute;left:126px;top:198px;z-index:10}
#slotm{position:absolute;left:386px;top:128px;z-index:9;cursor:pointer;image-rendering:pixelated}
.reel{position:absolute;image-rendering:pixelated}

#lights{left:394px;top:112px;display:none;z-index:850;padding-left:13px;background:#2a2430;color:#6a5f72;border-color:#120e16;box-shadow:inset 0 1px 0 #3a3242,0 1px 0 #120e16;cursor:default}
#lights::before{content:'';position:absolute;left:4px;top:50%;width:4px;height:4px;margin-top:-2px;background:#4a2a24;box-shadow:0 0 0 1px #120e16}
#lights:hover{transform:none}
#lights.part{color:#a89a7a;cursor:pointer}#lights.part::before{background:#8a5a2a}
#lights.ready{background:#e3c25a;color:var(--ink);border-color:var(--ink);cursor:pointer;animation:lightsGlow 1s steps(2) infinite}
#lights.ready::before{background:#fff6c8;box-shadow:0 0 0 1px #8a5a2a,0 0 0 3px rgba(255,214,120,.55)}
#lights.ready:hover{transform:translateY(-1px)}
@keyframes lightsGlow{0%{box-shadow:0 0 0 1px rgba(255,214,120,.9),0 0 0 3px rgba(255,190,90,.45),0 0 0 5px rgba(255,170,80,.2)}50%{box-shadow:0 1px 0 var(--ink);background:#c9a84a}}
.note-t{position:absolute;left:4px;top:9px;width:29px;height:25px;font-size:var(--fs6);line-height:7px;color:#3a2e1a;overflow:hidden;overflow-wrap:anywhere;outline:none;white-space:pre-wrap}
.note.editing{z-index:860!important}
.note.editing .note-t{background:rgba(255,255,255,.28);cursor:text;user-select:text;-webkit-user-select:text}
.note.editing{cursor:text}
#tray{position:absolute;left:360px;top:201px;width:116px;height:66px;border:1px solid #1e1a22;
  background:repeating-linear-gradient(90deg,rgba(26,22,30,.55) 0 3px,rgba(60,54,66,.45) 3px 4px);box-shadow:inset 0 0 0 1px #4a4550}
#tray span{position:absolute;left:3px;top:1px;font-size:var(--fs6);color:#9a8fb0;letter-spacing:.5px}
.slot{position:absolute;width:30px;height:20px;border:1px dashed #6d5f82;top:30px}
#info{position:absolute;left:150px;width:180px;top:0;height:10px;text-align:center;font-size:var(--fs7);line-height:10px;color:#b9a8d6;background:#16121c;border:1px solid #2e2836;border-top:0;letter-spacing:.3px;z-index:850;white-space:nowrap}
#thought{position:absolute;left:0;right:0;bottom:0;min-height:13px;box-sizing:border-box;background:rgba(18,14,22,.88);color:var(--dream);
  font-size:var(--fs7);line-height:9px;padding:2px 6px;font-style:italic;z-index:900;pointer-events:none;opacity:0;transition:opacity .3s}
.tk-name{position:absolute;left:3px;top:43px;width:40px;max-height:12px;overflow:hidden;font-size:var(--fs6);line-height:6px;color:#3a2e44;text-align:center}
.tk-photo{position:absolute;left:6px;top:14px}
.tk-ink{position:absolute;left:18px;top:13px;opacity:.9}
.sticky-text{position:absolute;left:6px;top:13px;width:40px;font-size:var(--fs7);line-height:8px;color:#4a3a1a;transform:rotate(-3deg)}

/* overlays */
.ov{position:absolute;inset:0;display:none;z-index:1000}
.ov.on{display:block}
#start{background:#141016;color:var(--paper);text-align:center}
#start h1{font-family:'PixFix','Pixelify Sans',var(--font);font-size:var(--fs20);margin:84px 0 4px;color:var(--dream);letter-spacing:1px}
#start p{font-size:var(--fs8);margin:2px;color:#9a8fb0}
#start .blink{margin-top:26px;font-size:var(--fs9);color:var(--paper);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.dim{position:absolute;inset:0;background:rgba(14,10,18,.72)}
.paper{position:absolute;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.5);padding:8px 10px;font-size:var(--fs8);line-height:10px}
.paper h2{font-size:var(--fs10);margin:0 0 4px;color:#3a3242}
.paper .small{font-size:var(--fs7);color:#5a4f62}
#memo .paper{left:76px;top:10px;width:310px;transform:rotate(-1deg);max-height:238px;overflow-y:auto;scrollbar-width:thin}
.kw{border-bottom:1px dotted #8a5a3a;color:#6a2e2a}
.ic{display:inline-block;width:7px;height:7px;vertical-align:-1px}

/* the dossier book */
#book .bk{position:absolute;left:68px;top:22px;width:344px;height:220px;perspective:900px}
.page{position:absolute;top:0;width:170px;height:220px;background:#e2d6b0;color:#3a2e22;image-rendering:pixelated;background-size:170px 220px;box-sizing:border-box;padding:12px 12px 10px;
  font-size:var(--fs7_5);line-height:10px;border:1px solid var(--ink);overflow:hidden}
.page.l{left:0;box-shadow:inset -6px 0 6px -4px rgba(60,50,70,.35)}
.page.r{left:172px;box-shadow:inset 6px 0 6px -4px rgba(60,50,70,.35)}
.page h3{font-size:var(--fs9);margin:0 0 5px;color:#4a2e24;border-bottom:1px solid #a8916a;padding-bottom:2px}
.page p{margin:0 0 6px}
.page .pn{position:absolute;bottom:4px;font-size:var(--fs6);color:#8a8a8a}
.page.l .pn{left:8px}.page.r .pn{right:8px}
.leaf{position:absolute;top:0;width:170px;height:220px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.1,.3,1);z-index:5}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden}
.leaf .face .page{left:0}
.leaf .back{transform:rotateY(180deg)}
#book .nav{top:246px}
#bprev{left:150px}#bnext{left:296px}#bclose{left:214px}
.photo{width:64px;height:76px;border:1px solid #4a3a2a;background:#a9a68c;margin:2px auto 6px}
.snaps{display:flex;gap:6px;justify-content:center}.snap{width:68px}.snap .photo{margin:2px auto 3px}.snap p{font-size:var(--fs7);line-height:8px;margin:0;text-align:center}
.locked{color:#9a9a9a;font-style:italic}

/* the dream */
#dreamov{background:#1a1726}
#dreambg{position:absolute;left:0;top:0}
#guests{position:absolute;left:0;right:0;top:24px;height:80px;display:flex;justify-content:center;gap:18px}
#guests .g{position:relative;width:64px;height:76px;opacity:0;transform:translateY(10px);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
#guests .g.in{opacity:1;transform:none;animation:float 2.4s steps(3) infinite alternate}
#guests .g .pl{position:absolute;right:-10px;bottom:-6px}
#guests .g .fl{position:absolute;left:0;right:0;top:-9px;text-align:center;font-size:var(--fs6);color:#c7b3e6;letter-spacing:1px}
@keyframes float{to{transform:translateY(-3px)}}
#g2wrap{position:absolute;left:201px;top:122px}
#dtext{position:absolute;left:56px;top:192px;width:348px;box-sizing:border-box;min-height:30px;padding:5px 10px 8px;color:#fff6dc;font-size:var(--fs8);line-height:11px;text-align:center;
  background:rgba(18,12,30,.86);border:1px solid #6a5a92;box-shadow:0 0 0 1px #120c1e;text-shadow:1px 1px 0 #000}
#dtext:empty{display:none}
#dtext .more{position:absolute;right:5px;bottom:1px;color:#e3c25a;animation:blink 1s steps(2) infinite}
#dreamov.wait{cursor:pointer}
#dtitle{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:var(--fs8);color:#9a8fb0;letter-spacing:1px}
.pop{position:absolute;font:600 var(--fs8) var(--font);pointer-events:none;animation:pop 1.1s ease-out forwards;text-shadow:1px 1px 0 #1a1726;z-index:5}
@keyframes pop{from{transform:translateY(0);opacity:1}to{transform:translateY(-14px);opacity:0}}
#morning .paper{left:96px;top:14px;width:268px;max-height:222px;overflow-y:auto;scrollbar-width:thin}
#morning .res{font-weight:600;margin:6px 0}
#morning .ok{color:var(--green)}#morning .no{color:var(--red)}
#again{left:96px;top:244px}
#nextn{right:116px;top:244px}
.clue{color:#6a5a48;font-style:italic;margin-bottom:2px}
.diary{background:#e9dfbf;border-left:2px solid #b8a46a;padding:3px 6px;margin:0 0 6px;box-shadow:1px 1px 0 rgba(0,0,0,.15)}
.cyr #start h1{font-family:var(--font)}
#langs{margin-top:22px;display:flex;justify-content:center;gap:10px}
#langs .btn{position:relative;font-size:var(--fs9);padding:2px 10px 3px}
#langs .btn.cur{background:#e3c25a}
#t_reset{position:relative;margin-top:14px;font-size:var(--fs7);padding:1px 8px 2px;opacity:.7}
#tmenu{margin:26px auto 0;width:150px;display:flex;flex-direction:column;gap:6px}
#tmenu .mb{position:relative;font-size:var(--fs9);padding:3px 8px 4px;text-align:center}
#tmenu .mb.warn{background:#d8805a}
#t_cont{background:#e3c25a}
#gear{left:3px;top:2px;z-index:850;width:13px;height:13px;padding:0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#2a2430;border-color:#120e16;box-shadow:inset 0 1px 0 #3a3242,0 1px 0 #120e16}#gear:hover{background:#3a3242}
#gearc{width:9px;height:9px}
#settings{z-index:1100}#settings .paper{left:100px;top:22px;width:280px;padding:8px 12px 10px}
#settings h2{margin:0 0 6px;font-size:var(--fs9)}
.srow2{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:var(--fs8)}
.srow2 .sl{width:78px;flex:none}.srow2 .sv{width:18px;text-align:right;color:#6a5f72}
.seg{display:flex;gap:3px;flex-wrap:wrap}.sb{cursor:pointer;border:1px solid #9a8a72;padding:0 4px 1px;background:#efe6cc}.sb:hover{background:#f6eccc}.sb.on{background:#e3c25a;border-color:var(--ink)}
#settings input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:#b8a88a;border:1px solid var(--ink);margin:0;cursor:pointer}
#settings input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:10px;background:#e3c25a;border:1px solid var(--ink);border-radius:0}
#settings input[type=range]::-moz-range-thumb{width:6px;height:10px;background:#e3c25a;border:1px solid var(--ink);border-radius:0}
.sbtns{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.sbtns .btn{position:relative;padding:1px 8px 2px}
#malb{left:370px;top:14px}
#album .paper{left:50px;top:8px;width:358px;height:222px;overflow-y:auto;scrollbar-width:thin;padding-top:4px}
#aclose{right:58px;top:246px}
.atabs{display:flex;gap:6px;align-items:center;border-bottom:1px solid #b8a88a;padding-bottom:3px;margin-bottom:4px;position:sticky;top:-4px;background:var(--paper);z-index:1}
.atab{cursor:pointer;padding:1px 6px;border:1px solid transparent;color:#6a5f72}.atab.on{border-color:var(--ink);background:#e3c25a;color:var(--ink)}
.adust{margin-left:auto;font-weight:600;color:#7a5aa8}
#album h3{font-size:var(--fs8);margin:6px 0 2px;color:#3a3242}
#album .ae{margin:0 0 2px}#album .ae.un{display:flex;flex-wrap:wrap;gap:2px}
#album .aslot{display:inline-block;width:9px;height:9px;line-height:9px;text-align:center;font-size:var(--fs6);color:#a49a8a;border:1px dashed #b8a88a}
.srow{display:flex;flex-wrap:wrap;gap:4px}
.sit{cursor:pointer;border:1px solid #9a8a72;padding:1px 5px;background:#efe6cc}.sit:hover{background:#f6eccc}
.sit.on{background:#e3c25a;border-color:var(--ink)}.sit.no{opacity:.45;cursor:default}
#morning .alb{color:#7a5aa8}
.dg .page{font-size:var(--fs7);line-height:10px}.dg .page h3{font-size:var(--fs8_5)}.dg #bubble{font-size:var(--fs7);line-height:8.5px}
.dg #dtext{font-size:var(--fs8);line-height:12px}.dg .gl{font-size:var(--fs6)}.dg .paper{font-size:var(--fs7_5);line-height:10.5px}
</style>
</head>
<body>
<div id="stage">
  <img id="room" src="../art/px/out/room.png" width="480" height="270" alt="">
  <div id="hall">
    <div id="vclip"><div id="visitor"><img id="vimg" width="64" height="76" alt=""></div></div>
    <div id="bubble"><span class="who" id="who"></span><span id="btext"></span></div>
    <div class="btn" id="ask"></div><div class="btn" id="check"></div><div id="quiz"></div>
  </div>
  <canvas id="wfx" width="360" height="106"></canvas>
  <div id="info"></div>
  <div class="btn" id="gear"><canvas id="gearc" width="9" height="9"></canvas></div>
  <div class="btn" id="lights"></div>
  <canvas id="film" width="266" height="70"></canvas>

  <div class="item" id="folder"><img src="../art/px/out/folder.png" width="120" height="156" alt=""></div>
  <div class="item" id="lamp"><img src="../art/px/out/lamp.png" width="104" height="78" alt=""></div>
  <div class="item" id="gauge"><canvas id="g1" width="78" height="68"></canvas></div>
  <div class="item" id="mug"><img src="../art/px/out/mug.png" width="60" height="65" alt=""></div>
  <div class="item" id="pad"><img src="../art/px/out/pad.png" width="42" height="44" alt=""></div>
  <div class="item" id="bell"><img src="../art/px/out/bell.png" width="26" height="20" alt=""></div>

  <canvas class="lit" id="shade" width="480" height="270"></canvas>
  <canvas class="lit" id="glow" width="480" height="270"></canvas>
  <canvas class="lit" id="slotglow" width="480" height="270"></canvas>
  <canvas class="lit" id="motes" width="480" height="270"></canvas>
  <div id="thought"></div>

  <div class="ov on" id="start">
    <h1 id="t_title">MORPHEUS AT THE DESK</h1>
    <p id="t_sub"></p>
    <div id="tmenu">
      <div class="btn mb" id="t_cont"></div>
      <div class="btn mb" id="t_new"></div>
      <div class="btn mb" id="t_album"></div>
      <div class="btn mb" id="t_set"></div>
    </div>
  </div>

  <div class="ov" id="settings"><div class="dim"></div><div class="paper" id="spaper"></div></div>

  <div class="ov" id="memo"><div class="dim"></div>
    <div class="paper">
      <div id="memoBody"></div>
      <div class="btn" id="memook" style="position:relative;display:inline-block;margin-top:4px"></div>
    </div>
  </div>

  <div class="ov" id="book"><div class="dim" id="bdim"></div>
    <div class="bk" id="bk"></div>
    <div class="btn nav" id="bprev"></div>
    <div class="btn nav" id="bclose"></div>
    <div class="btn nav" id="bnext"></div>
  </div>

  <div class="ov" id="dreamov">
    <canvas id="dreambg" width="480" height="270"></canvas>
    <div id="dtitle"></div>
    <div id="guests"></div>
    <div id="g2wrap"><canvas id="g2" width="78" height="68"></canvas></div>
    <div id="dtext"></div>
  </div>

  <div class="ov" id="morning"><div class="dim" style="background:rgba(30,26,34,.85)"></div>
    <div class="paper" id="mpaper"></div>
    <div class="btn" id="again"></div>
    <div class="btn" id="nextn"></div>
    <div class="btn" id="malb"></div>
  </div>

  <div class="ov" id="album"><div class="dim"></div>
    <div class="paper" id="apaper"></div>
    <div class="btn" id="aclose"></div>
  </div>
</div>

<script src="lang.js"></script>
<script src="week.js"></script>
<script src="album.js"></script>
<script src="music.js"></script>
<script src="menu.js"></script>
<script>
/* =========================================================
   CONTENT — night 1
   ========================================================= */
const MK=['fear','past','hope','love'];
const MNAME={fear:'FEAR',past:'PAST',hope:'HOPE',love:'LOVE'};
const MCOL={fear:'#a07ad6',past:'#6fa0c8',hope:'#e8c85a',love:'#e0708a'};
/* ---------- the week: 5 nights. Goals are hidden: the player reads a clue from Mira's life ---------- */
let SAVE=null;try{SAVE=JSON.parse(localStorage.getItem('morpheus.week')||'null')}catch(e){}
const NIGHT=SAVE&&SAVE.night>=1&&SAVE.night<=5?SAVE.night:1;

function effOf(e0,place){const e={...e0};
  if(place==='sky'){if(e.fear>0){e.hope=(e.hope||0)+e.fear;delete e.fear}if(e.past)e.past=r5(e.past*.5)}
  if(place==='school'){if(e.fear>0)e.fear=r5(e.fear*1.5);e.past=(e.past||0)+10;if(e.hope>0)e.hope=r5(e.hope*.5)}
  if(place==='home'){if(e.love>0)e.love=r5(e.love*1.5);if(e.fear>0)e.fear=r5(e.fear*.5);e.past=(e.past||0)+5}
  if(place==='studio'){e.hope=(e.hope||0)+10;e.past=(e.past||0)+5}
  if(place==='sea'){if(e.fear>0)e.fear=r5(e.fear*.5);e.love=(e.love||0)+5}
  if(place==='attic'){e.past=e.past>0?e.past*2:(e.past||0)+10;e.hope=(e.hope||0)-5}
  if(place==='fair'){if(e.hope>0)e.hope=r5(e.hope*1.5);if(e.love>0)e.love=r5(e.love*1.5);e.fear=(e.fear||0)+5}
  if(place==='train'){if(e.past>0){e.hope=(e.hope||0)+e.past;delete e.past}}
  for(const k in e)if(!e[k])delete e[k];return e}

function frameEff(e0,p){const e=effOf(e0,p?p.id:null);if(p&&p.m>1)for(const k in e)e[k]=r5(e[k]*p.m);return e}

let spread=0;const NSP=PAGES.length/2;
const PAPER=[0,1].map(makePaper);
function makePaper(seed){const W=170,H=220,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  let r=seed*9301+49297;const R=()=>(r=(r*9301+49297)%233280)/233280;
  const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];const cols=['#ece2c0','#e2d6b0','#d6c79c','#c8b688','#b8a274'];
  const spots=[];for(let i=0;i<14;i++)spots.push([R()*W,R()*H,1+R()*3.5,.6+R()*.8]);
  const ring=[25+R()*120,30+R()*160,13+R()*6];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const ex=Math.min(x,W-1-x)/W,ey=Math.min(y,H-1-y)/H,edge=Math.max(0,.16-Math.min(ex,ey))*7;
    const gut=seed?Math.max(0,.1-x/W)*5:Math.max(0,.1-(W-1-x)/W)*5;
    let f=.9+edge+gut+Math.sin(x*.05+y*.031+seed)*.18+Math.sin(y*.13+x*.02)*.08;
    for(const [sx,sy,sr,sa] of spots){const d=Math.hypot(x-sx,y-sy);if(d<sr)f+=sa*(1-d/sr)*1.6}
    const rd=Math.abs(Math.hypot(x-ring[0],(y-ring[1])*1.1)-ring[2]);if(rd<1.6)f+=1.1-rd*.5;else if(rd<3&&((x+y)&1))f+=.4;
    const b=Math.floor(f),fr=f-b,i=Math.min(cols.length-1,b+((B[y&3][x&3]+.5)/16<fr?1:0));
    c.fillStyle=cols[i];c.fillRect(x,y,1,1)}
  return cv.toDataURL()}
const pageHTML=(i,side)=>`<div class="page ${side}" style="background-image:url(${PAPER[i%2]})">${(PAGES[i]||'').replace('{{PRES}}',STR[LANG].pres[NIGHT>1?1:0])}<div class="pn">${i+1}</div></div>`;
function renderBook(){$('bk').innerHTML=pageHTML(spread*2,'l')+pageHTML(spread*2+1,'r');
  $('bprev').style.visibility=spread>0?'visible':'hidden';$('bnext').style.visibility=spread<NSP-1?'visible':'hidden';fixIcons()}
function fixIcons(){$('bk').querySelectorAll('.ic').forEach(el=>{if(el.firstChild)return;const k=el.dataset.ic;const cv=document.createElement('canvas');cv.width=7;cv.height=7;
  const c=cv.getContext('2d');ICON[k].forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#'){c.fillStyle=MCOL[k];c.fillRect(x,y,1,1)}}));el.appendChild(cv)})}
function openBook(){if($('dreamov').classList.contains('on'))return;$('book').classList.add('on');sfx.page();renderBook()}
function closeBook(){$('book').classList.remove('on');sfx.drop()}
let turning=false;
async function turn(dir){
  if(turning)return;const to=spread+dir;if(to<0||to>=NSP)return;turning=true;sfx.page();
  const bk=$('bk');const leaf=document.createElement('div');leaf.className='leaf';
  if(dir>0){leaf.style.left='172px';leaf.style.transformOrigin='-1px 50%';
    leaf.innerHTML=`<div class="face">${pageHTML(spread*2+1,'r')}</div><div class="face back">${pageHTML(to*2,'l')}</div>`;
    bk.querySelector('.page.r').outerHTML=pageHTML(to*2+1,'r');bk.appendChild(leaf);fixIcons();void leaf.offsetWidth;leaf.style.transform='rotateY(-180deg)';
  }else{leaf.style.left='0px';leaf.style.transformOrigin='171px 50%';
    leaf.innerHTML=`<div class="face">${pageHTML(spread*2,'l')}</div><div class="face back">${pageHTML(to*2+1,'r')}</div>`;
    bk.querySelector('.page.l').outerHTML=pageHTML(to*2,'l');bk.appendChild(leaf);fixIcons();void leaf.offsetWidth;leaf.style.transform='rotateY(180deg)';}
  leaf.querySelectorAll('.face .page').forEach(p=>p.style.left='0');
  await sleep(560);spread=to;renderBook();turning=false;
}
$('bnext').onclick=()=>turn(1);$('bprev').onclick=()=>turn(-1);$('bclose').onclick=closeBook;$('bdim').onclick=closeBook;

function drawDreamBG(){

    c.fillStyle=cols[clamp(b+((B[y%4][x%4]+.5)/16<fr?1:0),0,cols.length-1)];c.fillRect(x,y,1,1)}
  c.fillStyle='#eee8ff';for(let i=0;i<70;i++){const x=Math.random()*480|0,y=Math.random()*150|0;c.fillRect(x,y,1,1);if(i%9===0){c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3)}}

let CONTRIB=[];
async function endNight(){
  CONTRIB=[];

  drawDreamBG();const ov=$('dreamov');ov.style.opacity=0;ov.classList.add('on');ov.style.transition='opacity 1.2s';void ov.offsetWidth;ov.style.opacity=1;sfx.dream();

    await dline((f.i===NF-1?U.finale:'')+txt);await apply(e);await tap()}
  for(let a=0;a<NF-1;a++){const A=frames[a].t,B=frames[a+1].t;if(!A||!B)continue;
    const key=[A.v.id,B.v.id].sort().join('+');const cb=COMBOS[key];
    if(cb){albFind('c',key);CONTRIB.push({who:A.v.name+' & '+B.v.name,e:{...cb.e}});await dline('✦ '+cb.t);await apply(cb.e);await tap()}}

function morning(broke){
  const N=WN(),W=WU(),g=NT.goal,ok=!broke.length&&g.test(S);
  let main=ok?N.ok:N.bad;if(!ok&&!broke.length&&N.high)main=S.past>65?N.high:N.low;
  const L=[];
  if(broke.length){
    if(broke.includes('fear')&&S.fear>=100)L.push(U.mFear100);
    if(broke.includes('hope')&&S.hope<=0)L.push(U.mHope0);
    if(broke.includes('past')&&S.past>=100)L.push(U.mPast100);
    if(broke.includes('love')&&S.love>=100)L.push(U.mLove100);
    if(!L.length)L.push(W.broke)}
  L.push(main);
  if(!broke.length){
    if(S.hope>=65&&NIGHT!==3)L.push(U.mHope);
    if(S.love>=65&&NIGHT!==2)L.push(U.mLove);
    if(S.past>=80&&NIGHT!==4)L.push(U.mPast);
    if(S.love<=15)L.push(U.mLonely)}
  // the one frame (or combo) that mattered most for tonight's hidden need
  let key=g.k,d=typeof g.dir==='function'?g.dir(S):g.dir;
  if(!key){key=MK.reduce((a,k)=>Math.abs(S[k]-50)>Math.abs(S[a]-50)?k:a,'fear');d=S[key]>50?-1:1}
  const sc=c=>(c.e[key]||0)*d;let best=null;
  for(const c of CONTRIB)if(!best||(ok?sc(c)>sc(best):sc(c)<sc(best)))best=c;
  const why=best?(ok&&sc(best)>0?W.worked(best.who):!ok&&sc(best)<0?W.hurt(best.who):''):'';
  RESULTS[NIGHT-1]=ok;
  const row=k=>`<span class="ic" data-ic="${k}"></span> ${MNAME[k]} ${Math.round(S[k])}`;
  $('mpaper').innerHTML=`<h2>${W.mTitleN(N.day)}</h2>${L.map(l=>`<p>${l}</p>`).join('')}
    ${why?`<p class="res ${ok?'ok':'no'}">${why}</p>`:''}
    ${albNewLine()}<p class="small">${MK.map(row).join(' &nbsp; ')}</p>`;
  paintIcons($('mpaper'));
  $('nextn').textContent=NIGHT<5?W.nextNight:W.finish;$('again').textContent=W.replay;
  $('morning').classList.add('on');ok?sfx.good():sfx.bad();
}
